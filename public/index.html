<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Firestore Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <h2>Collections</h2>
        <button id="add-collection-btn" title="Nova coleção">+ Nova Coleção</button>
      </div>
      <ul id="collection-tree"></ul>
    </aside>
    <main id="content">
      <h1 id="app-title">Firestore Studio</h1>
      <div id="banner" class="banner" hidden></div>
      <div id="table-panel">
        <div id="table-toolbar">
          <span id="current-path"></span>
          <button id="add-doc-btn" disabled>+ Novo documento</button>
        </div>
        <table id="doc-table"><thead></thead><tbody></tbody></table>
        <div id="pagination">
          <button id="prev-page-btn" disabled>Anterior</button>
          <button id="next-page-btn" disabled>Próxima</button>
        </div>
      </div>
      <div id="editor-panel" hidden>
        <div id="editor-header">
          <span id="editor-title"></span>
          <button id="editor-close-btn">×</button>
        </div>
        <div id="editor-fields"></div>
        <div id="editor-actions">
          <button id="save-doc-btn">Salvar</button>
          <button id="delete-doc-btn">Apagar</button>
        </div>
      </div>
    </main>
  </div>
  <div id="create-collection-modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Nova coleção</span>
        <button id="create-collection-close-btn" class="modal-close-btn">×</button>
      </div>
      <div class="modal-body">
        <label class="modal-label" for="new-collection-name">Nome da coleção</label>
        <input id="new-collection-name" class="modal-input" type="text" placeholder="ex: users" />
        <label class="modal-label" for="new-collection-doc-id">ID do primeiro documento (opcional)</label>
        <input id="new-collection-doc-id" class="modal-input" type="text" placeholder="gerado automaticamente se vazio" />
        <div id="create-collection-error" class="modal-error" hidden></div>
      </div>
      <div class="modal-actions">
        <button id="create-collection-cancel-btn" class="modal-btn-secondary">Cancelar</button>
        <button id="create-collection-confirm-btn" class="modal-btn-primary">Criar</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
