name: Publish to npm

on:
  push:
    branches: [master]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Start Firestore emulator
        run: |
          npx firebase-tools emulators:start --only firestore --project demo-project > /tmp/emulator.log 2>&1 &
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/4588) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Emulador não subiu a tempo:"; cat /tmp/emulator.log; exit 1

      - run: npm test

      - name: Publish if version changed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION já publicado, pulando."
          else
            npm publish
          fi
